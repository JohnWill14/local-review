[package]
name = "local-review"
version = "0.1.0"
edition = "2021"
description = "Interactive local Git review in the terminal"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
git2 = "0.19"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
