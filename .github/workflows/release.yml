name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: tag
        name: Validate tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git rev-parse --verify "refs/tags/${tag}^{commit}"
          echo "value=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset_name }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: linux-x86_64
            executable: local-review
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: windows-2022
            asset_name: windows-x86_64
            executable: local-review.exe
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Linux asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/local-review-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}${{ matrix.suffix }}"
      - name: Package Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/local-review-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: "*-x86_64"
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum local-review-* > SHA256SUMS
      - name: Create or update pre-alpha release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Local Review $TAG" \
              --prerelease \
              --notes-file .github/release-notes.md
          fi
